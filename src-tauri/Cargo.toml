[package]
name = "sonoramix"
version = "1.1.0"
description = "SonoraMix — Native Windows audio session mixer and endpoint router"
authors = ["SonoraMix Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "sonoramix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime for IPC
tokio = { version = "1", features = ["sync", "time", "rt"] }

# Structured logging with filtering and spans
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling with context
thiserror = "1"

# Base64 encoding for icon transport
base64 = "0.22"

# Audio device enumeration and loopback capture
cpal = "0.15"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_Properties",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "implement",
]

[dependencies.windows-core]
version = "0.58"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Production optimizations: minimal binary size
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
